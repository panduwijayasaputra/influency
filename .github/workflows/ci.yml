name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: influency
          POSTGRES_PASSWORD: postgres # throwaway CI-only database, not a secret
          POSTGRES_DB: influency_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U influency -d influency_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Placeholder config only; CI never uses real secrets.
      NODE_ENV: test
      # Never contacted (vitest uses TEST_DATABASE_URL); must differ from it for test/global-setup.ts.
      DATABASE_URL: postgresql://influency:postgres@localhost:5432/influency
      TEST_DATABASE_URL: postgresql://influency:postgres@localhost:5432/influency_test
      MIDTRANS_IS_PRODUCTION: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `version` input: it reads packageManager from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
